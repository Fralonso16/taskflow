name: Backend Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    # services: contenedores auxiliares que GitHub Actions levanta
    # ANTES de ejecutar los pasos, y para automaticamente al terminar.
    # Es el mismo concepto que Docker Compose, pero dentro del workflow
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        working-directory: ./backend
        run: |
          pip install -r requirements.txt
          pip install pytest httpx

      - name: Ejecutar tests
        working-directory: ./backend
        env:
          DATABASE_URL: "postgresql://usuario:clave@localhost:5432/db_falsa"
          SECRET_KEY: "clave-de-test-solo-para-ci"
          REDIS_URL: "redis://localhost:6379"
        run: pytest